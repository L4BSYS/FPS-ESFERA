<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esfera — Patio de La Grieta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

</head>
<body>
  <div id="crt"></div>
  <div id="debug-info"></div>

  <!-- Three.js desde CDN, script clásico (no módulo) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Módulos del juego, cargados en orden de dependencia.
       Son <script> clásicos (no type="module") a propósito: los módulos ES
       solo cargan vía HTTP, NUNCA vía file://, así que abrir este archivo
       con doble click los rompería. Cada archivo se cuelga de un namespace
       global compartido (window.Game) en vez de usar import/export. -->
  <script src="src/config.js"></script>
  <script src="src/seed.js"></script>
  <script src="src/neuralnet.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/user.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/utils.js"></script>
  <script src="src/localFrame.js"></script>
  <script src="src/colliders.js"></script>
  <script src="src/groundHeight.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/playerHealth.js"></script>
  <script src="src/world.js"></script>
  <script src="src/torches.js"></script>
  <script src="src/wilds.js"></script>
  <script src="src/inventory.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/courtyard.js"></script>
  <script src="src/build.js"></script>
  <script src="src/creator.js"></script>
  <script src="src/projectiles.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/weapon.js"></script>
  <script src="src/input.js"></script>
  <script src="src/player.js"></script>
  <script src="src/body.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
